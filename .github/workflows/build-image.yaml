name: build-image
run-name: Build the shimboot and UEFI disk images for octopus
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # only the octopus shim boots on this firmware. Donor shims from other boards (nissa, dedede,
          # volteer, hatch) were tested on hardware and are rejected, so they are no longer built.
          - shim_board: octopus
            tag: octopus

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: free more root disk space
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: download repo
        uses: actions/checkout@v4
      
      - name: run build
        run: |
          sudo apt-get update
          sudo DEBUG=1 ./build_complete.sh compress_img=1 quiet=1 shim_board=${{ matrix.shim_board }}

      - name: check kexec made it into the image
        run: |
          # build.sh only warns if kexec fails to build, so make sure it is really there and static
          test -x bootloader/bin/kexec
          file bootloader/bin/kexec
          ! ldd bootloader/bin/kexec 2>/dev/null | grep -q "=>"

      - name: check the graphics stack made it into the rootfs
        run: |
          # setup_rootfs.sh only warns when a package fails to install, so prove they are really there
          r=data/rootfs_octopus
          cat $r/etc/debian_version
          dpkg-query --admindir=$r/var/lib/dpkg -W -f='${Package} ${Version}\n' mesa-vulkan-drivers libgl1-amber-dri libglx-amber0 libegl-amber0 vulkan-tools mesa-utils systemd
          test -e $r/usr/lib/x86_64-linux-gnu/libGLX_amber.so.0
          test -e $r/usr/lib/x86_64-linux-gnu/dri/i965_dri.so
          test -e $r/usr/share/glvnd/egl_vendor.d/50_amber.json
          ls $r/usr/share/vulkan/icd.d/ | grep -i intel
          test -f $r/etc/X11/Xsession.d/55shimboot-gpu
          # the session script should select amber on a 4.14 kernel and leave a 6.x kernel alone
          for k in 4.14.91-18023-gabcdef 6.12.48-amd64; do
            KVER=$k SCRIPT="$PWD/$r/etc/X11/Xsession.d/55shimboot-gpu" sh -c 'uname() { echo "$KVER"; }; . "$SCRIPT"; echo "kernel $KVER -> GLX=${__GLX_VENDOR_LIBRARY_NAME:-unset} EGL=${__EGL_VENDOR_LIBRARY_FILENAMES:-unset}"'
          done

      - name: show disk usage
        if: always()
        run: df -h

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.tag }}
          path: |
            data/shimboot_${{ matrix.tag }}.bin
            data/shimboot_${{ matrix.tag }}_boot.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            data/shimboot_${{ matrix.tag }}.zip
            data/shimboot_${{ matrix.tag }}_boot.zip

  build-uefi:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: free more root disk space
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: download repo
        uses: actions/checkout@v4

      - name: run build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools fdisk pcregrep pv zip
          sudo DEBUG=1 ./build_uefi.sh data/shimboot_octopus_uefi.bin
          sudo zip -j data/shimboot_octopus_uefi.zip data/shimboot_octopus_uefi.bin

      - name: show disk usage
        if: always()
        run: df -h

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_octopus_uefi
          path: data/shimboot_octopus_uefi.bin
          compression-level: 7

      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_octopus_uefi.zip
