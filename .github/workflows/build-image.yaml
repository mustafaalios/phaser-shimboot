name: build-image
run-name: Build the shimboot and UEFI disk images for octopus
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        board: [octopus]

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4
      
      - name: run build
        run: |
          sudo apt-get update
          sudo DEBUG=1 ./build_complete.sh ${{ matrix.board }} compress_img=1 quiet=1

      - name: check kexec made it into the image
        run: |
          # build.sh only warns if kexec fails to build, so make sure it is really there and static
          test -x bootloader/bin/kexec
          file bootloader/bin/kexec
          ! ldd bootloader/bin/kexec 2>/dev/null | grep -q "=>"

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.board }}
          path: data/shimboot_${{ matrix.board }}.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_${{ matrix.board }}.zip

  build-uefi:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: run build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools fdisk pcregrep zip
          sudo DEBUG=1 ./build_uefi.sh data/shimboot_octopus_uefi.bin
          sudo zip -j data/shimboot_octopus_uefi.zip data/shimboot_octopus_uefi.bin

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_octopus_uefi
          path: data/shimboot_octopus_uefi.bin
          compression-level: 7

      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_octopus_uefi.zip
