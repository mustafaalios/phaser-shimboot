name: build-image
run-name: Build the shimboot and UEFI disk images for octopus
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # the normal octopus image, and two experimental ones that use another board's shim kernel
          - shim_board: octopus
            tag: octopus
          - shim_board: nissa
            tag: octopus_nissa
          - shim_board: dedede
            tag: octopus_dedede
          # shims from the same era as the octopus one (May 2021), in case newer shims use a newer signing key
          - shim_board: volteer
            tag: octopus_volteer
          - shim_board: hatch
            tag: octopus_hatch

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: free more root disk space
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: download repo
        uses: actions/checkout@v4
      
      - name: run build
        run: |
          sudo apt-get update
          sudo DEBUG=1 ./build_complete.sh compress_img=1 quiet=1 shim_board=${{ matrix.shim_board }}

      - name: check kexec made it into the image
        run: |
          # build.sh only warns if kexec fails to build, so make sure it is really there and static
          test -x bootloader/bin/kexec
          file bootloader/bin/kexec
          ! ldd bootloader/bin/kexec 2>/dev/null | grep -q "=>"

      - name: show disk usage
        if: always()
        run: df -h

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.tag }}
          path: |
            data/shimboot_${{ matrix.tag }}.bin
            data/shimboot_${{ matrix.tag }}_boot.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            data/shimboot_${{ matrix.tag }}.zip
            data/shimboot_${{ matrix.tag }}_boot.zip

  build-uefi:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: free more root disk space
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: download repo
        uses: actions/checkout@v4

      - name: run build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap dosfstools fdisk pcregrep pv zip
          sudo DEBUG=1 ./build_uefi.sh data/shimboot_octopus_uefi.bin
          sudo zip -j data/shimboot_octopus_uefi.zip data/shimboot_octopus_uefi.bin

      - name: show disk usage
        if: always()
        run: df -h

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_octopus_uefi
          path: data/shimboot_octopus_uefi.bin
          compression-level: 7

      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_octopus_uefi.zip
