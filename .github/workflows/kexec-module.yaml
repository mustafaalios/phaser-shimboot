name: kexec-module
run-name: Build the kexec module for the octopus shim kernel
on:
  push:
    paths:
      - kexec_mod/**
      - tools/fetch_shim.sh
      - tools/inspect_shim_kernel.sh
      - tools/build_shim_kmod.sh
      - .github/workflows/kexec-module.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y python3-lz4 python3-zstandard kmod unzip

      - name: download the octopus shim
        run: tools/fetch_shim.sh octopus shim.bin

      - name: inspect the shim kernel and its modules
        run: sudo tools/inspect_shim_kernel.sh shim.bin inspect && sudo chown -R "$USER" inspect

      - name: fetch the chromeos kernel source at the shim's commit
        run: |
          repo="https://chromium.googlesource.com/chromiumos/third_party/kernel"
          sha="$(grep -aoE 'Linux version [^ ]+' inspect/vmlinux | head -n1 | grep -oE 'g[0-9a-f]+$' | cut -c2-)"
          echo "shim commit (abbrev): $sha"
          #gitiles expands the abbreviated commit to a full sha (its JSON body is prefixed with a )]}' line)
          full="$(curl -sSf "$repo/+/$sha?format=JSON" | tail -n +2 | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          echo "shim commit (full): $full"
          git init -q ksrc
          cd ksrc
          git remote add origin "$repo"
          #chromium googlesource allows fetching a commit by sha, so grab just that one commit's tree
          git fetch -q --depth 1 origin "$full"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse HEAD)"

      - name: build the modules (gcc 8, close to the shim's era)
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:20.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq gcc-8 make bc bison flex libelf-dev libssl-dev kmod python3 >/dev/null
            ln -sf /usr/bin/gcc-8 /usr/local/bin/gcc
            echo "::group::prepare + smoke module (validates toolchain and vermagic)"
            tools/build_shim_kmod.sh ksrc kexec_mod/smoke inspect
            echo "::endgroup::"
            echo "::group::kexec module"
            make -C ksrc M=/w/kexec_mod/src modules
            modinfo -F vermagic kexec_mod/src/shimboot_kexec.ko
            echo "::endgroup::"
          '

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kexec_mod
          path: |
            kexec_mod/**/*.ko
            inspect/modules.vermagic
