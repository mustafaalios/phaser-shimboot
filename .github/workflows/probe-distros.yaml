name: probe-distros
run-name: Which distro releases ship a Mesa that starts on the octopus 4.14 kernel
on:
  push:
    paths:
      - .github/workflows/probe-distros.yaml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bullseye", "debian:bookworm", "debian:trixie", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - name: package versions in ${{ matrix.image }}
        run: |
          docker run --rm ${{ matrix.image }} bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null 2>&1
            echo "== ${{ matrix.image }}"
            for p in mesa-vulkan-drivers libgl1-mesa-dri libgl1-amber-dri libglx-amber0 libegl-amber0 systemd libc6; do
              printf "  %-22s %s\n" "$p" "$(apt-cache policy $p | sed -n "s/^  Candidate: //p")"
            done
            echo "  amber-ish packages:"
            apt-cache search amber | grep -iE "^lib(gl|glx|egl|gles|gbm).*amber|mesa-amber" | sed "s/^/    /" || true
          '

  custom-repo:
    runs-on: ubuntu-latest
    steps:
      - name: which suites does the shimboot package repo publish
        run: |
          base=https://shimboot.ading.dev/debian
          for suite in bullseye bookworm trixie unstable; do
            printf '  %-10s Release=%s\n' "$suite" "$(curl -sL -o /dev/null -w '%{http_code} -> %{url_effective}' $base/dists/$suite/Release)"
          done
          echo "  dists listing:"
          curl -sSL $base/dists/ | grep -o 'href="[^"?][^"]*"' | head -n 20 | sed 's/^/    /' || true
          echo "  packages in bookworm:"
          curl -sSL $base/dists/bookworm/main/binary-amd64/Packages 2>/dev/null | sed -n 's/^Package: //p;s/^Version: /    version /p' | head -n 40

  amber-packages:
    runs-on: ubuntu-latest
    steps:
      - name: what is inside the mesa-amber packages from the shimboot repo
        run: |
          base=https://shimboot.pages.dev/debian
          for suite in bookworm trixie; do
            echo "== suite $suite: amber and mesa related packages"
            curl -sSL $base/dists/$suite/main/binary-amd64/Packages | python3 -I -c '
          import sys
          for block in sys.stdin.read().split("\n\n"):
              f = dict(l.split(": ", 1) for l in block.splitlines() if ": " in l and not l.startswith(" "))
              n = f.get("Package", "")
              if "amber" in n or "mesa" in n or n == "croskbd":
                  print("  %-28s %-16s %s" % (n, f.get("Version"), f.get("Filename")))
          '
          done
          mkdir -p debs && cd debs
          curl -sSL $base/dists/bookworm/main/binary-amd64/Packages | python3 -I -c '
          import sys
          for block in sys.stdin.read().split("\n\n"):
              f = dict(l.split(": ", 1) for l in block.splitlines() if ": " in l and not l.startswith(" "))
              if f.get("Package") in ("libglx-amber0", "libgl1-amber-dri", "libegl-amber0"):
                  print(f["Filename"])
          ' > list.txt
          while read f; do curl -sSLO "$base/$f"; done < list.txt
          for d in *.deb; do
            echo "######## $d"
            dpkg-deb -I "$d" | grep -E "^ (Package|Version|Depends|Conflicts|Provides|Replaces)"
            dpkg-deb -c "$d" | awk '{print "    " $NF}' | grep -vE "/$" | head -n 40
          done
